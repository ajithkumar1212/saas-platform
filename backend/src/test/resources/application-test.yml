spring:
  application:
    name: saas-platform-backend-test

  datasource:
    driver-class-name: org.postgresql.Driver
    # Testcontainers PostgreSQL will override url, username, password dynamically

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration/control
    schemas: public
    default-schema: public
    table: flyway_schema_history

platform:
  tenancy:
    default-schema: public
    tenant-migration-locations: classpath:db/migration/tenant
    schema-prefix: test_tenant_
