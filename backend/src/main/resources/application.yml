server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: saas-platform-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/saas_platform}
    username: ${SPRING_DATASOURCE_USERNAME:saas_ajith}
    password: ${SPRING_DATASOURCE_PASSWORD:saas_ajith}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: SaaS-HikariCP

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

  # Built-in Flyway manages ONLY the Control-Plane ('public' schema) on application boot
  flyway:
    enabled: true
    locations: classpath:db/migration/control
    schemas: public
    default-schema: public
    table: flyway_schema_history
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/saas-platform}

# Management & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

# OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Platform Specific Properties
platform:
  tenancy:
    default-schema: public
    tenant-migration-locations: classpath:db/migration/tenant
    schema-prefix: tenant_
